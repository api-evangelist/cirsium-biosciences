aid: cirsium-biosciences
name: Cirsium Biosciences
description: 'Cirsium Biosciences is a biotechnology company democratizing gene therapy through
  transformative manufacturing methods. It develops viral vector production systems that use whole
  plants as bioreactors, offering a highly scalable, linear scale-out platform for producing
  recombinant AAV (adeno-associated virus) vectors. The plant-based, controlled-environment
  agriculture approach targets the industry''s core production bottlenecks - inadequate global
  capacity, poor scalability, high clinical-grade manufacturing costs, and standardization
  challenges - claiming up to a 70% reduction in manufacturing lead times. Cirsium is a
  private, venture-backed therapeutics-manufacturing firm and is tracked in the API Evangelist
  network as a company profile; it does not currently publish a public developer API.'
